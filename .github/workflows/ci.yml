name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -r requirements.txt

      - name: Seed Demo Data Test
        run: |
          cd backend
          python -m app.seed_demo

      - name: Run Pytest Suite
        run: |
          cd backend
          python -m pytest

  ui-check:
    name: Gradio UI Check & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install UI & Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend && pip install -r requirements.txt
          cd ../ui && pip install -r requirements.txt

      - name: Check UI Importability & Run UI Pytest Suite
        run: |
          python -c "import ui.app; print('UI imported successfully!')"
          python -m pytest ui/tests/

