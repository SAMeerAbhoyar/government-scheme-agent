services:
  - type: web
    name: scheme-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash ../scripts/start_backend.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_DIMENSION
        value: "768"
      - key: JWT_SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: EMBEDDING_MODEL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: web
    name: scheme-ui
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r ui/requirements.txt
    startCommand: python ui/app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: GRADIO_SERVER_NAME
        value: 0.0.0.0
      - key: API_BASE_URL
        sync: false
