version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scheme_agent_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scheme_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scheme_password}
      POSTGRES_DB: ${POSTGRES_DB:-scheme_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scheme_user} -d ${POSTGRES_DB:-scheme_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
