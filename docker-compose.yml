version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scheme_backend
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/scheme_agent.db
      DATABASE_URL_SYNC: sqlite:////app/data/scheme_agent.db
      JWT_SECRET_KEY: super-secret-jwt-key-change-this-in-production-min-32-chars
      ENCRYPTION_KEY: a3xR9Z5u1v8w2y4z7A6B8C0D2E4F6G8H
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: scheme_ui
    ports:
      - "7860:7860"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend


